{% extends "base.html" %}
{% block title %}入库 · 口播库{% endblock %}
{% block body %}
<section class="hero slim">
  <p class="kicker">合规入库</p>
  <h1>只收你有权使用的素材。</h1>
  <p class="lede">自己的作品可从相册/创作者中心导出；客户素材需要书面授权。这里不提供解析他人视频链接。</p>
</section>

{% if error %}
<p class="banner bad">{{ error }}</p>
{% endif %}
{% if ok %}
<p class="banner ok">{{ ok }}</p>
{% endif %}

<form class="ingest" action="/ingest" method="post" enctype="multipart/form-data">
  <label>标题
    <input name="title" required placeholder="例如：一周复盘四步法">
  </label>
  <div class="row">
    <label>作者
      <input name="author" placeholder="自己的抖音号昵称">
    </label>
    <label>合集
      <input name="collection" list="cols" value="默认合集">
      <datalist id="cols">
        {% for c in collections %}
        <option value="{{ c }}"></option>
        {% endfor %}
      </datalist>
    </label>
  </div>
  <label>话题标签（逗号分隔）
    <input name="tags" placeholder="复盘, 效率">
  </label>
  <label>分享链接（可选，只引用，不下载）
    <input name="source_url" placeholder="https://www.douyin.com/video/……">
  </label>
  <label>口播稿或 SRT
    <textarea name="transcript" rows="10" placeholder="粘贴剪映导出的字幕，或口播原文。有时间轴会自动保留。"></textarea>
  </label>
  <div class="row">
    <label>字幕文件
      <input type="file" name="transcript_file" accept=".srt,.vtt,.txt">
    </label>
    <label>本地视频（可选）
      <input type="file" name="video" accept="video/mp4,video/quicktime,video/webm">
    </label>
  </div>
  <label>备注
    <input name="notes" placeholder="拍摄场景、适用对象、授权范围">
  </label>
  <button type="submit">写入知识库</button>
</form>
{% endblock %}
