[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awcollector"
version = "0.1.0"
description = "授权范围内的政务网页自动采集（DOM 优先，OCR 兜底）"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "authorized-web-collector" }]
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
ocr = ["rapidocr-onnxruntime>=1.3", "pillow>=10.0"]
dev = ["pytest>=8.0", "pillow>=10.0"]

[project.scripts]
awc = "awcollector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
